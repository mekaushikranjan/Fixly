services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fixly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-fixly}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - fixly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fixly} -d ${POSTGRES_DB:-fixly}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fixly-postgres-data:
